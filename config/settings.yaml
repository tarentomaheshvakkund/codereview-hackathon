application:
  name: "Multi-Agent PR Review System"
  version: "1.0.0"
  environment: "development"

dispatcher:
  # Dispatch strategy options:
  # - round_robin: Cycles through agents in order
  # - file_based: Selects agent based on files changed
  # - security_first: Always uses security agent if available
  # - fixed: Always uses the preferred_agent
  strategy: "file_based"
  preferred_agent: "static_analysis"  # Used when strategy is 'fixed'

orchestrator:
  max_parallel_agents: 4
  timeout_seconds: 300
  retry_attempts: 3

agents:
  static_analysis:
    enabled: true
    severity_threshold: "medium"
    languages:
      python:
        enabled: true
        tools: [pylint, flake8]
      java:
        enabled: true
        tools: [checkstyle, pmd]
      scala:
        enabled: true
        tools: [scalastyle, scalafix]
      javascript:
        enabled: true
        tools: [eslint]
      typescript:
        enabled: true
        tools: [eslint, tslint]
      nodejs:
        enabled: true
        tools: [eslint, jshint]
    
  security:
    enabled: true
    severity_threshold: "low"
    fail_on_high: true
    languages:
      python:
        enabled: true
        tools: [bandit, safety]
      java:
        enabled: true
        tools: [spotbugs, dependency-check]
      scala:
        enabled: true
        tools: [spotbugs, dependency-check]
      javascript:
        enabled: true
        tools: [npm-audit, eslint-security]
      typescript:
        enabled: true
        tools: [npm-audit, eslint-security]
      nodejs:
        enabled: true
        tools: [npm-audit, snyk]
    
  code_quality:
    enabled: true
    complexity_threshold: 10
    maintainability_threshold: 20
    languages:
      python:
        enabled: true
        tools: [radon]
      java:
        enabled: true
        tools: [pmd, sonarqube]
      scala:
        enabled: true
        tools: [sonarqube, scalastyle]
      javascript:
        enabled: true
        tools: [eslint, sonarqube]
      typescript:
        enabled: true
        tools: [eslint, sonarqube]
      nodejs:
        enabled: true
        tools: [eslint, sonarqube]
    
  context:
    enabled: true
    analyze_dependencies: true
    analyze_test_coverage: true
    check_breaking_changes: true
  
  coverage:
    enabled: true
    min_coverage_threshold: 80.0
    check_coverage: true
    analyze_complexity: true
  
  # AI Summary Agent (DEPRECATED - Use rag_enhanced instead)
  # RAG includes all AI Summary features plus historical context
  ai_summary:
    enabled: false  # Deprecated: RAG Enhanced Agent replaces this
    provider: "gemini"
    # Note: This agent is kept for backward compatibility only
    # Use rag_enhanced agent for better results with historical context
  
  # RAG Enhanced Agent (Recommended - replaces ai_summary)
  # Set RAG_ENABLED=true, AI_PROVIDER, and GEMINI_API_KEY/OPENAI_API_KEY in .env
  # Install: pip install chromadb sentence-transformers
  rag_enhanced:
    enabled: true  # Set to true to enable RAG-powered context-aware analysis
    vector_db_path: "./vector_db"  # Path to ChromaDB persistent storage
    embedding_model: "all-MiniLM-L6-v2"  # SentenceTransformer model for embeddings
    
    # AI Model Configuration
    # Provider: 'openai' or 'gemini' (set via AI_PROVIDER env var or defaults to config)
    ai_provider: "openai"  # Default provider: 'openai' or 'gemini'
    
    # OpenAI Models (when ai_provider = 'openai')
    openai_model: "gpt-4o"  # High-performance model for deep code understanding
    
    # Gemini Models (when ai_provider = 'gemini')
    gemini_model: "gemini-1.5-flash"  # Options: gemini-1.5-flash, gemini-1.5-pro, gemini-pro
    
    top_k: 5  # Number of similar PRs to retrieve
    min_similarity: 0.7  # Minimum similarity score (0-1) for relevance
    index_batch_size: 50  # Batch size for indexing historical PRs
    auto_index: true  # Automatically index new PRs after analysis
    # Features:
    # - Retrieves similar historical PRs using semantic search
    # - Learns from past issues and solutions
    # - Provides context-aware recommendations
    # - Identifies recurring patterns
    # - Suggests best practices from successful PRs
    # Note: RAG includes all AI Summary features + historical context

feedback_aggregator:
  prioritize_security: true
  group_by_severity: true
  include_suggestions: true

# PR Comments Configuration
pr_comments:
  enabled: true  # Enable/disable automated PR commenting
  track_in_database: true  # Track all posted comments in database for analytics
  post_summary: true  # Post a summary comment on the PR
  post_inline_comments: true  # Post inline comments on specific lines
  max_inline_comments: 500  # Maximum number of inline comments per PR
  severity_threshold: "LOW"  # Minimum severity to comment: CRITICAL, HIGH, MEDIUM, LOW, INFO
  group_by_file: true  # Group comments by file
  include_rag_insights: true  # Include RAG insights in summary
  # Review behavior:
  # - REQUEST_CHANGES if critical issues found
  # - COMMENT for all other cases
  # - Never auto-approves (requires manual review)

output:
  github:
    enabled: true
    comment_on_pr: true
    create_review: true
    request_changes_threshold: "high"
    
  slack:
    enabled: true
    mention_on_critical: true
    channel_notifications: true
    
  dashboard:
    enabled: true
    real_time_updates: true
    store_history: true

# Database Configuration
database:
  enabled: true
  host: "localhost"
  port: 5433
  database: "pr_analysis"
  username: "postgres"
  password: "postgres"
  echo: false  # Set to true for SQL query logging
  pool_size: 10
  max_overflow: 20
  
# Analytics Configuration
analytics:
  enabled: true
  min_prs_for_insights: 5
  trend_analysis_threshold: 10
  top_issues_limit: 10
  generate_recommendations: true

# Auto-Merge Configuration
auto_merge:
  enabled: false  # Set to true to enable auto-merge
  mode: "conditional"  # Options: conditional, always, never
  
  # Conditions that must be met for auto-merge
  conditions:
    # Quality score thresholds
    min_quality_score: 85.0
    min_security_score: 95.0
    min_maintainability_score: 70.0
    
    # Issue count limits
    max_critical_issues: 0
    max_high_issues: 0
    max_medium_issues: 5
    max_total_issues: 20
    
    # Code review requirements
    require_approval: true
    min_approvals: 1
    
    # PR metadata requirements
    require_tests: false
    require_description: false
    
    # File change limits
    max_files_changed: 50
    max_lines_changed: 1000
    
    # Specific checks
    check_security_issues: true
    check_breaking_changes: true
    allow_wip_prs: false  # Don't auto-merge PRs with [WIP] or draft status
    
  # Merge method
  merge_method: "squash"  # Options: merge, squash, rebase
  
  # Post-merge actions
  delete_branch: true
  post_merge_comment: true
  
  # Repositories allowed for auto-merge (empty = all allowed)
  allowed_repositories: []
  # Example:
  # - "KB-iGOT/cb-ext-course-service"
  # - "KB-iGOT/cb-ui-assessment"
  
  # Users/teams allowed to trigger auto-merge (empty = all allowed)
  allowed_users: []
  # Example:
  # - "ruksana2808"
  # - "maheshrv"
